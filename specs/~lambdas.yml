overview: |
  When a data value is a function (lambda), Whiskers invokes it rather than
  rendering the delegate type name.

  Variable interpolation ({{key}} or {{{key}}}):
    Func<object>  — called with no arguments; result is converted to string,
                    HTML-escaped (for {{key}}), and interpolated.

  Variable interpolation with arguments ({{key arg}}, {{{key arg}}}, or {{&key arg}}):
    Func<object[], object>              — receives parsed arguments in order, without
                                          raw content or a render callback.
    The result is converted to string and interpolated, never re-rendered as a
    template. Normal tags HTML-escape the result; triple-mustache and ampersand
    forms do not. Missing keys retain normal lookup behavior; resolved values
    that do not accept arguments for this tag form cause an error.

  Section lambdas ({{#key}}...{{/key}}):
    Func<string, string>                — receives raw (unexpanded) section content;
                                          return value is re-rendered as Mustache.
    Func<string, object>                — same, but return type is object.
    Func<object, string, object>        — receives the current context view and
                                          raw content; return is re-rendered.
    Func<string, Func<string, string>, object>
                                        — receives raw content and a render callback
                                          that renders any template in the current
                                          context; return is re-rendered.

  All section lambda return values are re-rendered as Mustache in the current
  context using the original delimiters.

  Standalone opening-tag line endings and closing-tag indentation are excluded
  from the raw section body passed to a lambda. Other body content is preserved.
  Returned templates and render-callback inputs use the same standalone rules
  as ordinary templates, including for section lambdas with arguments.

  Lambda fixtures used by these tests (resolved by name in the test runner):
    identity        Func<string, string>   s => s
    bold            Func<string, string>   s => "<b>" + s + "</b>"
    upcase          Func<string, object>   s => s.ToUpper()
    const-hello     Func<object>           () => "hello"
    bold-tag        Func<object>           () => "<b>"
    context-name    Func<object,string,object>  (ctx, s) => "{ctx.name}: {s}"
    to-name         Func<string, object>   _ => "{{name}}"  (used to test re-rendering)
    join-args       Func<object[], object> args => string.Join("|", args)
                    Joins argument values using invariant string conversion.

  Test runners must register join-args for the argument-taking interpolation
  fixtures below, in addition to the existing named lambda fixtures.

tests:
  # ── Interpolation lambdas ────────────────────────────────────────────────────

  - name: "Interpolation lambda - invoked"
    desc: "Func<object> is called and its return value is interpolated."
    lambdas:
      ts: const-hello
    template: "{{ts}}"
    expected: "hello"

  - name: "Interpolation lambda - HTML escaped"
    desc: "The Func<object> result is HTML-escaped like a normal variable."
    lambdas:
      fn: bold-tag
    template: "{{fn}}"
    expected: "&lt;b&gt;"

  - name: "Interpolation lambda - unescaped"
    desc: "Triple-mustache skips escaping for lambda results."
    lambdas:
      fn: bold-tag
    template: "{{{fn}}}"
    expected: "<b>"

  # ── Section lambdas: Func<string, string> ────────────────────────────────────

  - name: "Section lambda - result re-rendered"
    desc: "Func<string, string> return is re-rendered in the current context."
    data: {name: World}
    lambdas:
      wrap: identity
    template: "{{#wrap}}Hello, {{name}}!{{/wrap}}"
    expected: "Hello, World!"

  - name: "Section lambda - bold wrapping"
    desc: "Func<string, string> can wrap raw content; result is re-rendered."
    lambdas:
      wrap: bold
    template: "{{#wrap}}hello{{/wrap}}"
    expected: "<b>hello</b>"

  - name: "Section lambda - raw content passed"
    desc: "The lambda receives raw (unexpanded) section text, not the rendered output."
    data: {name: World}
    lambdas:
      wrap: bold
    template: "{{#wrap}}{{name}}{{/wrap}}"
    expected: "<b>World</b>"

  # ── Section lambdas: Func<string, object> ────────────────────────────────────

  - name: "Section lambda - object return"
    desc: "Func<string, object> return is converted to string then re-rendered."
    lambdas:
      wrap: upcase
    template: "{{#wrap}}hello{{/wrap}}"
    expected: "HELLO"

  - name: "Section lambda - object return re-renders in context"
    desc: "Func<string,object> return value is re-rendered; Mustache tags in the result are expanded."
    data: {name: World}
    lambdas:
      wrap: to-name
    template: "{{#wrap}}ignored{{/wrap}}"
    expected: "World"

  # ── Section lambdas: Func<object, string, object> ────────────────────────────

  - name: "Context-aware lambda"
    desc: "Func<object, string, object> receives the current context and raw content."
    data: {name: Alice}
    lambdas:
      greet: context-name
    template: "{{#greet}}world{{/greet}}"
    expected: "Alice: world"

  - name: "Context-aware lambda - skips primitive context frame"
    desc: "When nested inside a primitive-valued section, ctx is the nearest non-primitive ancestor, not the boolean/scalar."
    data: {name: Alice, active: true}
    lambdas:
      greet: context-name
    template: "{{#active}}{{#greet}}world{{/greet}}{{/active}}"
    expected: "Alice: world"

  # ── Section lambdas: Func<string, Func<string,string>, object> ───────────────

  - name: "Render-callback lambda"
    desc: "The callback renders any template string in the current context."
    data: {name: Bob}
    lambdas:
      wrap: render-bold
    template: "{{#wrap}}{{name}}{{/wrap}}"
    expected: "<b>Bob</b>"

  - name: "Render-callback with static text"
    desc: "The callback passes static text through unchanged."
    lambdas:
      wrap: render-bold
    template: "{{#wrap}}hello{{/wrap}}"
    expected: "<b>hello</b>"

  - name: "Render-callback - alternate delimiters propagated"
    desc: "The render callback uses the delimiter pair active inside the section, not the default {{ }}."
    data: {name: World}
    lambdas:
      wrap: render-bold
    template: "{{=<% %>=}}<% #wrap %><% name %><% /wrap %>"
    expected: "<b>World</b>"

  # ── Func<object> in section (not a section lambda signature) ─────────────────

  - name: "Func<object> in section - treated as truthy"
    desc: "Func<object> is not a section lambda signature; the delegate is truthy so the body renders once, uncalled."
    lambdas:
      ts: const-hello
    template: "{{#ts}}body{{/ts}}"
    expected: "body"

  # ── Standalone section lambda ────────────────────────────────────────────────

  - name: "Section lambda - standalone open tag"
    desc: "When the opening tag is on its own line, the leading newline consumed by standalone processing is excluded from raw."
    data: {name: World}
    lambdas:
      wrap: identity
    template: "Begin.\n{{#wrap}}\nHello {{name}}\n{{/wrap}}\nEnd."
    expected: "Begin.\nHello World\nEnd."

  - name: "Section lambda - nested standalone sections"
    desc: "Re-rendering an identity lambda result consumes nested standalone tag lines without adding blank lines."
    data: {items: [one, two]}
    lambdas:
      wrap: identity
    template: "Before\n{{#wrap}}\n  {{#items}}\n  {{.}}\n  {{/items}}\n{{/wrap}}\nAfter"
    expected: "Before\n  one\n  two\nAfter"

  - name: "Section lambda - nested standalone sections with tabs and CRLF"
    desc: "Nested standalone processing preserves content tabs and CRLF line endings."
    data: {items: [one, two]}
    lambdas:
      wrap: identity
    template: "Before\r\n{{#wrap}}\r\n\t{{#items}}\r\n\t{{.}}\r\n\t{{/items}}\r\n{{/wrap}}\r\nAfter"
    expected: "Before\r\n\tone\r\n\ttwo\r\nAfter"

  - name: "Section lambda - standalone closing indentation excluded"
    desc: "The indentation before a standalone closing tag is not included in the raw lambda body."
    lambdas:
      wrap: identity
    template: "Before\n  {{#wrap}}\n  body\n  {{/wrap}}\nAfter"
    expected: "Before\n  body\nAfter"

  - name: "Section lambda - standalone closing indentation excluded with CRLF"
    desc: "Standalone closing-tag tab indentation is excluded without changing content indentation or CRLF."
    lambdas:
      wrap: identity
    template: "Before\r\n\t{{#wrap}}\r\n\tbody\r\n\t{{/wrap}}\r\nAfter"
    expected: "Before\r\n\tbody\r\nAfter"

  - name: "Section lambda - wrapping preserves body boundary whitespace"
    desc: "Standalone handling removes tag-line whitespace before the lambda wraps the body, but preserves the body's final newline."
    lambdas:
      wrap: bold
    template: "Before\n  {{#wrap}}\n  body\n  {{/wrap}}\nAfter"
    expected: "Before\n<b>  body\n</b>After"

  - name: "Section lambda - empty inline body preserves its line"
    desc: "An adjacent opening and closing tag pair is not standalone."
    lambdas:
      wrap: identity
    template: "Before\n  {{#wrap}}{{/wrap}}\nAfter"
    expected: "Before\n  \nAfter"

  - name: "Section lambda - whitespace-only inline body preserves its line"
    desc: "Whitespace between opening and closing tags on the same line is preserved."
    lambdas:
      wrap: identity
    template: "Before\n  {{#wrap}}  {{/wrap}}\nAfter"
    expected: "Before\n    \nAfter"

  - name: "Section lambda - inline closing tag preserves indentation"
    desc: "A closing tag followed by content on the same line is not standalone, so its preceding indentation remains in the raw body."
    lambdas:
      wrap: identity
    template: "Before{{#wrap}}  body\n  {{/wrap}}After"
    expected: "Before  body\n  After"

  - name: "Section lambda - intentional blank lines preserved"
    desc: "Excluding standalone tag-line whitespace must not trim other blank lines or content indentation."
    lambdas:
      wrap: identity
    template: "Before\n  {{#wrap}}\n\n  body\n\n  {{/wrap}}\nAfter"
    expected: "Before\n\n  body\n\nAfter"

  - name: "Render-callback lambda - nested standalone sections"
    desc: "The render callback applies standalone handling before its output is wrapped by the lambda."
    data: {items: [one, two]}
    lambdas:
      wrap: render-bold
    template: "{{#wrap}}\n  {{#items}}\n  {{.}}\n  {{/items}}\n{{/wrap}}"
    expected: "<b>  one\n  two\n</b>"

  - name: "Render-callback lambda - standalone sections with alternate delimiters"
    desc: "Render callbacks apply standalone handling with the active delimiters and preserve CRLF line endings."
    data: {items: [one, two]}
    lambdas:
      wrap: render-bold
    template: "{{=<% %>=}}\r\n<%#wrap%>\r\n  <%#items%>\r\n  <%.%>\r\n  <%/items%>\r\n<%/wrap%>"
    expected: "<b>  one\r\n  two\r\n</b>"

  - name: "Arg lambda - callback strips nested standalone sections"
    desc: "Argument-taking section lambdas use the same standalone rules when rendering through a callback."
    data: {items: [one, two]}
    lambdas:
      truncate: truncate
    template: "{{#truncate 100}}\n  {{#items}}\n  {{.}}\n  {{/items}}\n{{/truncate}}"
    expected: "  one\n  two\n"

  - name: "Arg lambda - standalone closing indentation excluded"
    desc: "The raw body passed with parsed arguments excludes standalone closing-tag indentation."
    lambdas:
      wrap: wrap-tag
    template: "Before\n  {{#wrap \"em\"}}\n  body\n  {{/wrap}}\nAfter"
    expected: "Before\n<em>  body\n</em>After"

  # ── Arg-accepting lambdas ─────────────────────────────────────────────────────

  - name: "Arg lambda - truncate with render callback"
    desc: "Func<object[], string, Func<string,string>, object> receives parsed args, raw content, and a render callback."
    data: {body: "Hello, World!"}
    lambdas:
      truncate: truncate
    template: "{{#truncate 7}}{{body}}{{/truncate}}"
    expected: "Hello, …"

  - name: "Arg lambda - string argument"
    desc: "Quoted string arguments are passed as strings; Func<object[], string, string> wraps content in a tag."
    lambdas:
      wrap: wrap-tag
    template: "{{#wrap \"em\"}}text{{/wrap}}"
    expected: "<em>text</em>"

  - name: "Arg lambda - unquoted string argument"
    desc: "Unquoted string arguments are literals rather than context lookups."
    data: {em: strong}
    lambdas:
      wrap: wrap-tag
    template: "{{#wrap em}}text{{/wrap}}"
    expected: "<em>text</em>"

  - name: "Arg lambda - non-function with args throws"
    desc: "Providing arguments to a key whose value is not an arg-accepting function is an error."
    data: {title: "Hello"}
    template: "{{#title \"arg\"}}x{{/title}}"
    throws: true

  - name: "Arg lambda - dynamic argument"
    desc: "A star-prefixed argument is resolved from the current context at render time."
    data: {body: "Hello, World!", limit: 7}
    lambdas:
      truncate: truncate
    template: "{{#truncate *limit}}{{body}}{{/truncate}}"
    expected: "Hello, …"

  # Interpolation lambdas with arguments

  - name: "Interpolation arg lambda - literal arguments"
    desc: "Quoted and unquoted strings are literals; numeric arguments are passed in order."
    data: {word: resolved}
    lambdas:
      join: join-args
    template: "{{join \"foo bar\" word 42 3.14}}"
    expected: "foo bar|word|42|3.14"

  - name: "Interpolation arg lambda - dynamic arguments"
    desc: "Dynamic arguments use the current context or an explicit root lookup."
    data: {value: root, item: {value: local}}
    lambdas:
      join: join-args
    template: "{{#item}}{{join *value *@root.value}}{{/item}}"
    expected: "local|root"

  - name: "Interpolation arg lambda - HTML escaped and not re-rendered"
    desc: "The result is HTML-escaped without expanding template tags in it."
    data: {name: World}
    lambdas:
      join: join-args
    template: '{{join "<b>{{name}}</b>"}}'
    expected: "&lt;b&gt;{{name}}&lt;/b&gt;"

  - name: "Interpolation arg lambda - triple-mustache"
    desc: "Triple-mustache neither HTML-escapes nor re-renders the result."
    data: {name: World}
    lambdas:
      join: join-args
    template: '{{{join "<b>{{name}}</b>"}}}'
    expected: "<b>{{name}}</b>"

  - name: "Interpolation arg lambda - ampersand"
    desc: "Ampersand interpolation neither HTML-escapes nor re-renders the result."
    data: {name: World}
    lambdas:
      join: join-args
    template: '{{&join "<b>{{name}}</b>"}}'
    expected: "<b>{{name}}</b>"

  - name: "Interpolation arg lambda - alternate delimiters"
    desc: "Argument-taking interpolation uses the active delimiters."
    lambdas:
      join: join-args
    template: '{{=<% %>=}}<%join "<b>"%>|<%&join "<b>"%>'
    expected: "&lt;b&gt;|<b>"

  - name: "Interpolation arg lambda - not standalone"
    desc: "An argument-taking variable tag preserves surrounding whitespace and newlines."
    lambdas:
      join: join-args
    template: "Begin.\n  {{join text}}\nEnd."
    expected: "Begin.\n  text\nEnd."

  - name: "Interpolation arg lambda - non-function throws"
    desc: "Arguments on a resolved non-function value cause an error."
    data: {title: Hello}
    template: "{{title arg}}"
    throws: true

  - name: "Interpolation arg lambda - null throws"
    desc: "A present null value does not accept arguments."
    data: {value: null}
    template: "{{value arg}}"
    throws: true

  - name: "Interpolation arg lambda - no-argument function throws"
    desc: "A no-argument lambda cannot silently ignore supplied arguments."
    lambdas:
      fn: const-hello
    template: "{{fn arg}}"
    throws: true

  - name: "Interpolation arg lambda - section-only function throws"
    desc: "A function accepting raw section text is not an argument-taking variable lambda."
    lambdas:
      fn: wrap-tag
    template: "{{fn em}}"
    throws: true

  - name: "Interpolation arg lambda - missing key renders empty"
    desc: "Arguments do not change non-strict lookup behavior for an absent key."
    data: {}
    template: "a{{missing arg}}b"
    expected: "ab"
